<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小前宝 ProstaPal · 前列腺癌工作台 v0.1.1</title>
<meta name="description" content="小前宝 ProstaPal：前列腺癌患者与照护者的本机资料工作台。当前页面为模拟演示，不含真实患者资料。">
<!-- 内联 favicon：file:// 打开时不给图标会在控制台留 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322664e'/%3E%3Ctext x='16' y='23' font-size='18' font-family='PingFang SC,Helvetica,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E5%89%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<div class="app">
  <aside class="sidebar" aria-label="小前宝业务导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">前</span>
      <div class="brand-text"><strong>小前宝</strong><span>ProstaPal · 前列腺癌工作台</span></div>
    </div>

    <div class="profile" aria-label="当前演示档案">
      <span class="avatar" aria-hidden="true">陈</span>
      <div class="profile-text"><b id="profile-name">陈先生</b><span id="profile-meta">演示档案 A</span></div>
    </div>

    <nav id="nav" class="nav" aria-label="一级业务导航"></nav>

    <div class="sidebar-foot">
      <span class="eyebrow">数据边界</span>
      <p>记录不是诊断。<br>本页全部为模拟演示。<br>判断由你和治疗团队做出。</p>
      <a class="text-link" href="#principles">这版能做什么</a>
    </div>
  </aside>

  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小前宝工作台 <span aria-hidden="true">/</span> <b id="breadcrumb">今日看板</b></div>
      <div class="top-actions">
        <!-- 页面内唯一的 AI 入口：把预写提示词交给宿主原生会话，页面不自建聊天窗 -->
        <button type="button" class="agent-entry" id="agent-btn" aria-label="和 AI 讨论：把本页记录交给宿主原生会话">和 AI 讨论</button>
        <button type="button" id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
        <span class="ver-chip" id="ver-chip" aria-label="版本 0.1.1">v0.1.1</span>
      </div>
    </header>

    <div class="demo-bar" role="note">
      <b>模拟演示</b>
      <span>全部为虚构资料 · 刷新重置 · 不读写真实文件 · 不连接医院系统</span>
    </div>

    <main id="main" tabindex="-1"></main>

    <footer class="footer">
      <span>小前宝 ProstaPal · 把事实放回位置，判断留给医生</span>
      <span class="ver-line"><b>v0.1.1</b> · 演示数据截止 2026-10-20</span>
    </footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="noscript">本页需要 JavaScript 才能显示模拟数据。</p></noscript>

<!-- 顺序固定：数据 → 应用（经典脚本，file:// 下可直接打开） -->
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
